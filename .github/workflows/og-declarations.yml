name: OG declarations

# Every page listed in sitemap.xml must carry a complete, self-consistent
# Open Graph / Twitter Card block - see assets/inc/og-meta.html for the
# canonical shape. The site has no build step, so nothing else keeps a new
# page from shipping without it - this check does. A page missing even
# og:image fails the build; that guarantee, not a one-time fix pass, is the
# deliverable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-og-declarations:
    runs-on: ubuntu-latest
    name: Every sitemap page has a complete, self-consistent OG/Twitter block
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OG/Twitter metadata
        shell: python3 {0}
        run: |
          import html
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          SITE_ORIGIN = "https://transitrix.com"
          fail = False

          def error(msg):
              global fail
              print(f"::error::{msg}")
              fail = True

          TITLE_RE = re.compile(r"<title>(.*?)</title>", re.DOTALL)
          DESC_RE = re.compile(r'<meta\s+name="description"\s+content="([^"]*)"')
          META_PROP_RE = re.compile(r'<meta\s+property="([^"]+)"\s+content="([^"]*)"')
          META_NAME_RE = re.compile(r'<meta\s+name="([^"]+)"\s+content="([^"]*)"')
          LANG_RE = re.compile(r'<html[^>]*\slang="([^"]+)"')

          def extract_head_facts(page_html):
              title_m = TITLE_RE.search(page_html)
              desc_m = DESC_RE.search(page_html)
              lang_m = LANG_RE.search(page_html)
              props = {}
              for m in META_PROP_RE.finditer(page_html):
                  props.setdefault(m.group(1), []).append(html.unescape(m.group(2)))
              names = {}
              for m in META_NAME_RE.finditer(page_html):
                  names.setdefault(m.group(1), []).append(html.unescape(m.group(2)))
              return {
                  "title": html.unescape(title_m.group(1)) if title_m else None,
                  "description": html.unescape(desc_m.group(1)) if desc_m else None,
                  "lang": lang_m.group(1) if lang_m else None,
                  "og": props,
                  "meta": names,
              }

          def check_page(file_path, url_path, facts):
              errs = 0

              def og(key):
                  vals = facts["og"].get(f"og:{key}", [])
                  if len(vals) > 1:
                      nonlocal errs
                      print(f"  {file_path}: og:{key} declared {len(vals)} times, expected at most 1")
                      errs += 1
                  return vals[0] if vals else None

              if facts["title"] is None:
                  print(f"  {file_path}: no <title> found")
                  errs += 1
              if facts["description"] is None:
                  print(f"  {file_path}: no meta description found")
                  errs += 1

              og_type = og("type")
              if og_type != "website":
                  print(f"  {file_path}: og:type = {og_type!r}, expected 'website'")
                  errs += 1

              og_url = og("url")
              expected_url = SITE_ORIGIN + url_path
              if og_url != expected_url:
                  print(f"  {file_path}: og:url = {og_url!r}, expected {expected_url!r}")
                  errs += 1

              og_title = og("title")
              if not og_title:
                  print(f"  {file_path}: og:title is missing or empty")
                  errs += 1
              elif facts["title"] is not None and og_title != facts["title"]:
                  print(f"  {file_path}: og:title {og_title!r} does not match <title> {facts['title']!r}")
                  errs += 1

              og_desc = og("description")
              if not og_desc:
                  print(f"  {file_path}: og:description is missing or empty")
                  errs += 1
              elif facts["description"] is not None and og_desc != facts["description"]:
                  print(f"  {file_path}: og:description does not match the page's own meta description")
                  errs += 1

              og_image = og("image")
              image_path = None
              if not og_image:
                  print(f"  {file_path}: og:image is missing or empty")
                  errs += 1
              else:
                  parts = urlsplit(og_image)
                  if not parts.scheme or not parts.netloc:
                      print(f"  {file_path}: og:image {og_image!r} is not an absolute URL")
                      errs += 1
                  elif f"{parts.scheme}://{parts.netloc}" != SITE_ORIGIN:
                      print(f"  {file_path}: og:image {og_image!r} does not point at {SITE_ORIGIN}")
                      errs += 1
                  else:
                      image_path = parts.path.lstrip("/")
                      if not os.path.isfile(image_path):
                          print(f"  {file_path}: og:image resolves to {image_path!r}, which does not exist in the repo")
                          errs += 1

              if og("image:width") != "1200":
                  print(f"  {file_path}: og:image:width = {og('image:width')!r}, expected '1200'")
                  errs += 1
              if og("image:height") != "630":
                  print(f"  {file_path}: og:image:height = {og('image:height')!r}, expected '630'")
                  errs += 1

              lang = facts["lang"]
              expected_locale = "de_DE" if lang == "de" else "en_US" if lang == "en" else None
              expected_alt = "en_US" if lang == "de" else "de_DE" if lang == "en" else None
              locale = og("locale")
              alt_locale = og("locale:alternate")
              if expected_locale is None:
                  print(f"  {file_path}: <html lang=...> is {lang!r}, expected 'en' or 'de' to check og:locale against")
                  errs += 1
              else:
                  if locale != expected_locale:
                      print(f"  {file_path}: og:locale = {locale!r}, expected {expected_locale!r} for lang={lang!r}")
                      errs += 1
                  if alt_locale != expected_alt:
                      print(f"  {file_path}: og:locale:alternate = {alt_locale!r}, expected {expected_alt!r}")
                      errs += 1

              twitter_card = facts["meta"].get("twitter:card", [])
              if twitter_card != ["summary_large_image"]:
                  print(f"  {file_path}: twitter:card = {twitter_card!r}, expected exactly one 'summary_large_image'")
                  errs += 1
              twitter_image = facts["meta"].get("twitter:image", [])
              if not twitter_image or twitter_image[0] != og_image:
                  print(f"  {file_path}: twitter:image does not match og:image")
                  errs += 1

              return errs

          print("== Self-test: the checker itself must catch what it's meant to catch ==")
          selftest_fail = False

          complete_html = '''<html lang="en"><head><title>Example | Transitrix</title>
          <meta name="description" content="An example page.">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://transitrix.com/example/">
          <meta property="og:title" content="Example | Transitrix">
          <meta property="og:description" content="An example page.">
          <meta property="og:image" content="https://transitrix.com/assets/og/transitrix-og.png">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta property="og:locale" content="en_US">
          <meta property="og:locale:alternate" content="de_DE">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:image" content="https://transitrix.com/assets/og/transitrix-og.png">
          </head><body></body></html>'''
          facts = extract_head_facts(complete_html)
          if check_page("fixture:complete", "/example/", facts) != 0:
              print("::error::self-test regression - a complete, correct OG block was flagged as broken")
              selftest_fail = True
          else:
              print("ok: a complete, correct OG block passes")

          bare_html = '<html lang="en"><head><title>Bare | Transitrix</title><meta name="description" content="No OG here."></head><body></body></html>'
          facts = extract_head_facts(bare_html)
          if check_page("fixture:bare", "/bare/", facts) == 0:
              print("::error::self-test regression - a page with no OG tags at all should fail but passed")
              selftest_fail = True
          else:
              print("ok: a page with no OG tags correctly fails")

          missing_image_html = complete_html.replace(
              '<meta property="og:image" content="https://transitrix.com/assets/og/transitrix-og.png">\n', ""
          )
          facts = extract_head_facts(missing_image_html)
          if check_page("fixture:no-image", "/example/", facts) == 0:
              print("::error::self-test regression - a page missing og:image should fail but passed")
              selftest_fail = True
          else:
              print("ok: a page missing og:image correctly fails")

          if selftest_fail:
              print("::error::og-declarations self-test failed - the checker itself is broken, not trusting its verdict on real pages")
              sys.exit(1)

          print("== Checking every page listed in sitemap.xml ==")
          with open("sitemap.xml", encoding="utf-8") as f:
              sitemap = f.read()

          locs = re.findall(r"<loc>([^<]+)</loc>", sitemap)
          if not locs:
              error("sitemap.xml has no <loc> entries")
              sys.exit(1)

          for loc in locs:
              url_path = urlsplit(loc).path
              # Skip PDF entries - they are binary files with no HTML/OG structure
              if url_path.endswith(".pdf"):
                  print(f"-- {loc} (skipped - PDF, not HTML)")
                  continue
              rel = url_path.lstrip("/")
              file_path = (rel + "index.html") if (rel == "" or rel.endswith("/")) else rel
              print(f"-- {loc} -> {file_path}")
              try:
                  with open(file_path, encoding="utf-8") as f:
                      page_html = f.read()
              except FileNotFoundError:
                  error(f"sitemap references a file that does not exist: {file_path}")
                  continue
              facts = extract_head_facts(page_html)
              errs = check_page(file_path, url_path, facts)
              if errs:
                  error(f"{file_path}: {errs} OG/Twitter metadata problem(s), see log above")
              else:
                  print(f"  ok: {file_path}")

          if fail:
              sys.exit(1)
          print("og-declarations: every sitemap page has a complete, self-consistent OG/Twitter block.")
