name: Public-surface hygiene

# Two guards on this public surface:
#
#   1. Filename ban - CLAUDE.md / AGENTS.md are internal agent-ops docs and are
#      never tracked here.
#   2. Hub-pointer scan - a public repository never points at the private hub.
#      The slug lives only in the HYGIENE_HUB_SLUG secret, so this file does not
#      name it and its own diff cannot trip the scan; failures report the file
#      path and never the matched term.
#
# The scan runs twice over different inputs on purpose: the diff pass fails the
# change under review, and the full-tree pass catches whatever landed before the
# guard existed - which a diff scan cannot see by construction. This repository
# is exactly that case: a README line pointing at the hub sat here until a manual
# sweep found it on 2026-07-29.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hub-pointer-scan:
    runs-on: ubuntu-latest
    name: Hub-pointer scan (diff + full tree)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and the PR diff
        env:
          HUB: ${{ secrets.HYGIENE_HUB_SLUG }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -z "${HUB:-}" ]; then
            echo "slug not configured; scanning the cross-ref form only."
            PATTERN='strategy#[0-9]'
          else
            PATTERN="${HUB}|strategy#[0-9]"
          fi

          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in .github/workflows/public-surface-hygiene.yml) continue ;; esac
            if grep -Iqi -E "$PATTERN" "$f" 2>/dev/null; then
              echo "::error file=$f::Private-hub pointer in a tracked file. Committed content carries no hub pointer and no work-item reference."
              fail=1
            fi
          done < <(git ls-files)

          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            if git diff "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude).github/workflows/public-surface-hygiene.yml' \
                 | grep -E '^\+[^+]' | grep -Eqi "$PATTERN"; then
              echo "::error::Private-hub pointer in an added diff line."
              fail=1
            fi

            # Commit-message pass. This surface was scanned by nothing until
            # 2026-07-30, and it holds the most: a message is written once, lands
            # in the default branch, and no later pass over files or PR metadata
            # can see it. Only BASE..HEAD is read, so a change is judged on what
            # it adds and existing history is not re-litigated on every run.
            if git log --format=%B "$BASE_SHA..$HEAD_SHA" 2>/dev/null | grep -Eqi "$PATTERN"; then
              echo "::error::Private-hub pointer in a commit message."
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::public-surface-hygiene: hub-pointer scan failed. Matched terms are deliberately not printed."
            exit 1
          fi
          echo "public-surface-hygiene: hub-pointer scan clean."

      - name: Work-item references
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Two rules, on two different surfaces.
          #
          # 1. COMMITTED CONTENT carries no reference to a work item at all -
          # neither the neutral `HUB-<number>` form nor a bare hash-number.
          # (Commit messages are read too, and were scanned by nothing before
          # 2026-07-30 - the sweeps that cleaned files and PR metadata never
          # looked at one.) The
          # evidence for the stronger rule is the sweep that produced it: of
          # roughly 110 such references across the two repositories that had
          # them, not one carried information a reader could use. The prose
          # beside them already said what the code does and why; the number was
          # decoration that only a maintainer with private access could resolve,
          # and it aged badly the moment a work item was renumbered or closed.
          # What a line needs is the REASON, and a durable reason is a decision -
          # cited by name and date, which is stable and resolvable by anyone.
          #
          # 2. NOR IN PR METADATA, NOR IN A COMMIT MESSAGE. A carve-out briefly
          # allowed a citation in a PR title or body on the theory that a pull
          # request is transient. It is not: this repository squashes with
          # COMMIT_OR_PR_TITLE and merges with PR_TITLE, so a PR title BECOMES a
          # commit subject on the default branch. A rule that depends on a
          # per-repository merge setting also breaks quietly the day the setting
          # differs. The reference lives in the hub issue, which already links to
          # the pull request - the one place that can resolve it.
          #
          # A reference to this repository's own issue or PR is untouched by
          # either rule: a plain hash-number, and the `closes` / `fixes`
          # auto-close keywords, mean what they say.
          #
          # These patterns name nothing confidential, so they live here in the
          # open and the matched token IS printed. A contributor who cannot see
          # why the build failed routes around the rule. This file is excluded
          # from its own scan; that exclusion is also the escape hatch for a doc
          # that must legitimately show the form.
          WORKITEM='(\bHUB-[0-9]+|\b(task|epic|hub)s?[[:space:]:]+#[0-9]+)'
          SELF='.github/workflows/public-surface-hygiene.yml'

          fail=0
          tmp="$(mktemp -d)"

          # report <pattern> <label> <file> <annotation-or-empty> <advice>
          report() {
            local pat="$1" label="$2" target="$3" anno="$4" advice="$5" hits tag
            hits="$(grep -oIiE "$pat" "$target" 2>/dev/null | sort -u | tr '\n' ' ' || true)"
            [ -n "$hits" ] || return 1
            if [ -n "$anno" ]; then tag="::error ${anno}::"; else tag="::error::"; fi
            echo "${tag}work-item reference in the ${label} ( ${hits}) - ${advice}"
            return 0
          }

          ADVICE="a work-item reference does not go on a public surface - keep the reason and drop the number, cite the decision by name and date, and leave the work-item trail in the hub issue"

          # 1) Full tree.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            [ "$f" = "$SELF" ] && continue
            if report "$WORKITEM" tree "$f" "file=$f" "$ADVICE"; then fail=1; fi
          done < <(git ls-files)

          # 2) Added diff lines, when there is a pull request to diff.
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ -f "$f" ] || continue
              [ "$f" = "$SELF" ] && continue
              git diff "$BASE_SHA" "$HEAD_SHA" -- "$f" | grep -E '^\+[^+]' > "$tmp/added" || true
              [ -s "$tmp/added" ] || continue
              if report "$WORKITEM" diff "$tmp/added" "file=$f" "$ADVICE"; then fail=1; fi
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          else
            echo "no pull-request context - scanning the tree only."
          fi

          # 3) PR title/body. The title becomes a commit subject on merge, so it
          # is committed content with a delay.
          printf '%s' "${PR_TITLE:-}" > "$tmp/title"
          printf '%s' "${PR_BODY:-}" > "$tmp/body"
          if report "$WORKITEM" title "$tmp/title" "" "$ADVICE"; then fail=1; fi
          if report "$WORKITEM" body "$tmp/body" "" "$ADVICE"; then fail=1; fi

          # 4) This change's own commit messages.
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git log --format=%B "$BASE_SHA..$HEAD_SHA" > "$tmp/messages" 2>/dev/null || true
            if [ -s "$tmp/messages" ]; then
              if report "$WORKITEM" "commit message" "$tmp/messages" "" "$ADVICE"; then fail=1; fi
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK - no work-item references on any scanned surface."

  check-hygiene:
    runs-on: ubuntu-latest
    name: Internal-ops filename ban
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ban CLAUDE.md / AGENTS.md
        shell: bash
        run: |
          if git ls-files | grep -qiE '(^|/)(CLAUDE|AGENTS)\.md$'; then
            echo "::error::CLAUDE.md/AGENTS.md are not allowed in this public repo (internal agent-ops docs)"
            exit 1
          fi
