name: Methodology version check

on:
  push:
    branches: [main]
    paths:
      - methodology/index.html
      - .github/scripts/test_methodology.cjs
      - .github/workflows/methodology-version-check.yml
  pull_request:
    branches: [main]
    paths:
      - methodology/index.html
      - .github/scripts/test_methodology.cjs
      - .github/workflows/methodology-version-check.yml

permissions:
  contents: read

jobs:
  check-methodology-version:
    runs-on: ubuntu-latest
    name: Methodology release loading and fallback
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dynamic release loading without network access
        run: node --test .github/scripts/test_methodology.cjs
