name: Publish gate

# Enforces exact declarations for the complete tracked public repository.
#
# Purpose: a public repository declares what it publishes to readers. An undeclared file that reaches
# main is a defect. This gate catches it before merge.
#
# The gate is mute: it reports what is undeclared (the file path), never why or what it protects.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest-enforcement:
    runs-on: ubuntu-latest
    name: Manifest enforcement — declared files only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test manifest checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_publish_manifest.py' -v

      - name: Check full tracked tree
        run: python3 .github/scripts/check_publish_manifest.py
